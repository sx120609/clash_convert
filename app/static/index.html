<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>订阅转换器 | Mihomo / Sing-box / Surge</title>
  <meta name="description" content="在线订阅链接转换工具，支持 Mihomo/Clash、Sing-box、Surge 及通用 URI 格式互转。" />
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #f8fbff;
      --line: #d9e3ee;
      --line-strong: #c4d5e6;
      --text: #1f2937;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: rgba(37, 99, 235, 0.12);
      --success: #14804a;
      --error: #b42318;
      --warn-bg: #fff8eb;
      --warn-border: #f6d9a8;
      --warn-text: #9a6700;
      --radius: 12px;
      --radius-sm: 10px;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Han Sans SC", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 8% 10%, rgba(37, 99, 235, 0.08), transparent 32%),
        radial-gradient(circle at 88% 12%, rgba(14, 165, 233, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .page {
      max-width: 1220px;
      margin: 26px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      background: linear-gradient(180deg, #ffffff, #f8fbff);
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .subtitle {
      margin: 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 20px;
      padding: 20px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 16px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .panel-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .form-item {
      display: grid;
      grid-template-columns: 152px 1fr;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      padding-top: 8px;
    }

    .control,
    .control input[type="text"],
    .control input[type="url"],
    .control select,
    .control textarea {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
    }

    .control input[type="text"],
    .control input[type="url"],
    .control select,
    .control textarea {
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      padding: 9px 12px;
      background: var(--surface-2);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }

    .control input[type="text"]:hover,
    .control input[type="url"]:hover,
    .control select:hover,
    .control textarea:hover {
      border-color: #b5c9de;
      background: #ffffff;
    }

    .control input[type="text"]:focus,
    .control input[type="url"]:focus,
    .control select:focus,
    .control textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
      background: #ffffff;
    }

    .control textarea {
      min-height: 88px;
      resize: vertical;
    }

    #textWrap textarea {
      min-height: 180px;
    }

    .radio-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 4px;
    }

    .radio-row label,
    .check-row label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      user-select: none;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: #fff;
      padding: 6px 12px;
      transition: border-color 0.18s ease, background-color 0.18s ease;
    }

    .radio-row label:hover,
    .check-row label:hover {
      border-color: var(--primary);
      background: #f8fbff;
    }

    .radio-row input,
    .check-row input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--primary);
    }

    .check-row {
      padding-top: 8px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 2px;
      padding-left: 164px;
    }

    button {
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: #fff;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 9px 14px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    button:hover {
      border-color: #9ec5ff;
      color: var(--primary);
      background: #f4f8ff;
    }

    .primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.24);
    }

    .primary:hover {
      border-color: var(--primary-hover);
      background: var(--primary-hover);
      color: #fff;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.28);
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #f9fafb;
      color: var(--text-muted);
      padding: 9px 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .status.success {
      background: #eefbf3;
      border-color: #cdeed9;
      color: var(--success);
    }

    .status.error {
      background: #fff2f1;
      border-color: #f8d0cc;
      color: var(--error);
    }

    pre {
      margin: 0;
      min-height: 318px;
      max-height: 560px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #f7fafe;
      color: var(--text);
      font-size: 12.5px;
      line-height: 1.65;
      padding: 12px;
    }

    .output-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .warn {
      margin-top: 12px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.6;
      border: 1px solid var(--warn-border);
      border-radius: 9px;
      background: var(--warn-bg);
      color: var(--warn-text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin: 16px 0 0;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .form-item {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .card-header {
        padding: 14px 16px;
      }

      .form-label {
        padding-top: 0;
      }

      .actions {
        padding-left: 0;
      }

      pre {
        min-height: 250px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="card-header">
        <div class="title-wrap">
          <h1 class="title">订阅转换</h1>
          <p class="subtitle">统一转换为 Mihomo / Sing-box / Surge / URI 输出格式</p>
        </div>
      </div>

      <div class="layout">
        <section class="panel">
          <h2 class="panel-title">参数设置</h2>

          <div class="form-item">
            <label class="form-label">来源类型:</label>
            <div class="control radio-row">
              <label><input type="radio" name="sourceType" value="url" checked /> URL</label>
              <label><input type="radio" name="sourceType" value="text" /> 文本</label>
            </div>
          </div>

          <div class="form-item" id="urlWrap">
            <label class="form-label" for="urlInput">订阅链接:</label>
            <div class="control">
              <textarea id="urlInput" placeholder="支持多个链接，换行或 | 分隔&#10;https://example.com/sub1&#10;https://example.com/sub2"></textarea>
            </div>
          </div>

          <div class="form-item" id="textWrap" style="display: none">
            <label class="form-label" for="textInput">订阅文本:</label>
            <div class="control">
              <textarea id="textInput" placeholder="支持整段 base64 或 URI 列表&#10;vmess://...&#10;vless://...&#10;ss://..."></textarea>
            </div>
          </div>

          <div class="form-item">
            <label class="form-label" for="targetSelect">客户端:</label>
            <div class="control">
              <select id="targetSelect">
                <option value="mihomo">Mihomo / Clash YAML</option>
                <option value="sing-box">Sing-box JSON</option>
                <option value="surge">Surge Conf</option>
                <option value="uri">URI 列表</option>
              </select>
            </div>
          </div>

          <div class="form-item" id="uriBase64Wrap" style="display: none">
            <div class="form-label"></div>
            <div class="control check-row">
              <label><input id="uriBase64" type="checkbox" /> URI 输出为 Base64 订阅</label>
            </div>
          </div>

          <div class="form-item">
            <label class="form-label" for="nodeIncludeInput">包含节点:</label>
            <div class="control">
              <textarea id="nodeIncludeInput" placeholder="仅保留包含关键词的节点，换行或 | 分隔，如：香港|HK"></textarea>
            </div>
          </div>

          <div class="form-item">
            <label class="form-label" for="nodeExcludeInput">排除节点:</label>
            <div class="control">
              <textarea id="nodeExcludeInput" placeholder="移除包含关键词的节点，换行或 | 分隔，如：流量|过期"></textarea>
            </div>
          </div>

          <div class="form-item">
            <div class="form-label"></div>
            <div class="control check-row">
              <label><input id="nodeFilterRegex" type="checkbox" /> 筛选词按正则表达式匹配</label>
            </div>
          </div>

          <div class="form-item">
            <label class="form-label" for="aclPresetSelect">远程配置:</label>
            <div class="control">
              <select id="aclPresetSelect">
                <option value="">不使用 ACL</option>
              </select>
            </div>
          </div>

          <div class="form-item">
            <label class="form-label" for="aclUrlInput">自定义 ACL:</label>
            <div class="control">
              <input id="aclUrlInput" type="url" placeholder="https://example.com/acl.txt" />
            </div>
          </div>

          <div class="actions">
            <button class="primary" id="convertBtn" type="button">生成订阅链接</button>
            <button id="copyBtn" type="button">复制链接</button>
          </div>
        </section>

        <section class="panel">
          <h2 class="panel-title">输出结果</h2>
          <div class="status" id="status">等待转换</div>
          <pre id="output"></pre>
          <div class="output-actions">
            <button id="openBtn" type="button">打开链接</button>
          </div>
          <div class="warn" id="warnBox" style="display: none"></div>
        </section>
      </div>
    </div>

    <div class="footer">Subscription Converter · Powered by FastAPI</div>
  </div>

  <script>
    const sourceTypeInputs = Array.from(document.querySelectorAll('input[name="sourceType"]'));
    const urlWrap = document.getElementById("urlWrap");
    const textWrap = document.getElementById("textWrap");
    const targetSelect = document.getElementById("targetSelect");
    const uriBase64Wrap = document.getElementById("uriBase64Wrap");
    const uriBase64 = document.getElementById("uriBase64");
    const urlInput = document.getElementById("urlInput");
    const textInput = document.getElementById("textInput");
    const nodeIncludeInput = document.getElementById("nodeIncludeInput");
    const nodeExcludeInput = document.getElementById("nodeExcludeInput");
    const nodeFilterRegex = document.getElementById("nodeFilterRegex");
    const aclPresetSelect = document.getElementById("aclPresetSelect");
    const aclUrlInput = document.getElementById("aclUrlInput");
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    const warnBox = document.getElementById("warnBox");
    const convertBtn = document.getElementById("convertBtn");
    const copyBtn = document.getElementById("copyBtn");
    const openBtn = document.getElementById("openBtn");

    function currentSourceType() {
      return sourceTypeInputs.find((item) => item.checked)?.value || "url";
    }

    function syncSourceType() {
      const type = currentSourceType();
      urlWrap.style.display = type === "url" ? "grid" : "none";
      textWrap.style.display = type === "text" ? "grid" : "none";
    }

    function syncTargetType() {
      uriBase64Wrap.style.display = targetSelect.value === "uri" ? "grid" : "none";
    }

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = "status" + (type ? ` ${type}` : "");
    }

    function showWarnings(warnings) {
      if (!warnings || warnings.length === 0) {
        warnBox.style.display = "none";
        warnBox.textContent = "";
        return;
      }
      warnBox.style.display = "block";
      warnBox.textContent = `⚠ 警告 (${warnings.length})\n${warnings.join("\n")}`;
    }

    async function loadAclPresets() {
      try {
        const resp = await fetch("/api/acl-presets");
        if (!resp.ok) return;
        const payload = await resp.json();
        const items = Array.isArray(payload?.items) ? payload.items : [];
        for (const item of items) {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.label;
          aclPresetSelect.appendChild(option);
        }
      } catch (err) {
        setStatus(`ACL 预设加载失败: ${err.message}`, "error");
      }
    }

    sourceTypeInputs.forEach((item) => item.addEventListener("change", syncSourceType));
    targetSelect.addEventListener("change", syncTargetType);

    convertBtn.addEventListener("click", async () => {
      const sourceType = currentSourceType();
      const source = sourceType === "url" ? urlInput.value.trim() : textInput.value.trim();
      if (!source) {
        setStatus("请输入订阅来源。", "error");
        return;
      }

      setStatus("转换中...");
      showWarnings([]);
      outputEl.textContent = "";
      outputEl.dataset.link = "";

      try {
        const resp = await fetch("/api/convert", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source,
            source_type: sourceType,
            target: targetSelect.value,
            uri_as_base64: uriBase64.checked,
            node_include: nodeIncludeInput.value.trim() || null,
            node_exclude: nodeExcludeInput.value.trim() || null,
            node_filter_regex: nodeFilterRegex.checked,
            acl_preset: aclPresetSelect.value || null,
            acl_url: aclUrlInput.value.trim() || null,
          }),
        });
        const payload = await resp.json();
        if (!resp.ok) {
          const detail = payload?.detail;
          if (typeof detail === "string") throw new Error(detail);
          if (detail?.warnings) throw new Error(detail.warnings.join("\n"));
          throw new Error("转换失败");
        }

        setStatus(
          `完成: ${payload.node_count} 个节点 → ${payload.target}，有效期至 ${new Date(
            payload.expires_at * 1000
          ).toLocaleString()}`,
          "success"
        );
        outputEl.textContent = payload.result_url || "";
        outputEl.dataset.link = payload.result_url || "";
        showWarnings(payload.warnings || []);
      } catch (err) {
        setStatus(`失败: ${err.message}`, "error");
      }
    });

    copyBtn.addEventListener("click", async () => {
      const link = outputEl.dataset.link || outputEl.textContent || "";
      if (!link) {
        setStatus("没有可复制的链接。", "error");
        return;
      }
      try {
        await navigator.clipboard.writeText(link);
        setStatus("链接已复制到剪贴板", "success");
      } catch (err) {
        setStatus(`复制失败: ${err.message}`, "error");
      }
    });

    openBtn.addEventListener("click", () => {
      const link = outputEl.dataset.link || outputEl.textContent || "";
      if (!link) {
        setStatus("没有可打开的链接。", "error");
        return;
      }
      window.open(link, "_blank");
    });

    syncSourceType();
    syncTargetType();
    loadAclPresets();
  </script>
</body>

</html>
